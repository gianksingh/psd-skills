<!-- ============================================================================
     PSD MAP MODULE  ·  US "where it shipped" heat map + top-states bar list
     Reusable component for PSD reports (matches PSD deck design system).
     ----------------------------------------------------------------------------
     ► SINGLE IMPORT INSTRUCTION (paste this into any Claude chat):

       "Use the PSD map module (psd-map-module.html). I'll give you a CSV of orders
        by US state (one row per state, columns = state name + count). Run the
        embedded Python generator to build BOTH the choropleth SVG and the
        top-states bar rows from ONE shared heat ramp, then fill the {{MAP_SVG}},
        {{STATE_ROWS}} and rest-line placeholders. Keep the scoped .psd-map-module
        CSS. Color hierarchy MUST be consistent across both visuals: a given state's
        bar color equals its color on the map — lighter green = fewer, fuller/darker
        green = more. The #1 state's NAME is brand red (rank cue only, not a
        magnitude color). Don't recolor with purple."

     ----------------------------------------------------------------------------
     ► COLOR-HIERARCHY RULE (important — read before editing):
        The map and the bar list are TWO VIEWS OF THE SAME SCALE. Both are painted
        from the identical ramp, keyed on each state's value:
            fewer  →  light green   (pale)
            more   →  fuller/darker green → near-black-green (the max)
        So every state's list-bar fill = that state's map fill. Never give the bars
        a separate encoding (e.g. "all black bars with a neon leader") — that made
        neon read as "most" on the bars while it meant "mid/few" on the map. The
        bar LENGTH still encodes magnitude too; color reinforces it. The only
        non-magnitude accent is the #1 row's NAME in brand red (a rank marker).

     ► DATA SHAPE (CSV):
        - Required: a FULL US state-name column (e.g. "Massachusetts") + a numeric
          count column. A 2-letter code column is optional (row label; else derived).
        - Example columns: "Order Shipping State","Order Shipping State Code","Total orders"
        - % denominator = CSV total. DC/PR aren't in the GeoJSON; AK/HI aren't drawn
          (kept out of the contiguous frame). All stay in totals + the "+N more" line.

     ► GEOJSON SOURCE (contiguous + AK/HI, "name" = full state name):
        https://raw.githubusercontent.com/python-visualization/folium/main/examples/data/us-states.json

     ► GENERATOR (pure Python → inline SVG + row HTML; no browser/kaleido needed).
       Deps: pandas. Optional QA: cairosvg. Run, then paste stdout into the slots.
       NOTE how color(nm) is used for BOTH the map paths and the bar fills — that
       single shared function is what guarantees the consistent hierarchy.
     ----------------------------------------------------------------------------
     import json, math, urllib.request, pandas as pd

     CSV_PATH   = "orders_by_state.csv"      # <- your CSV
     NAME_COL   = "Order Shipping State"      # full state name column
     COUNT_COL  = "Total orders"              # numeric column
     TOP_N      = 10
     GEOJSON_URL= "https://raw.githubusercontent.com/python-visualization/folium/main/examples/data/us-states.json"

     NAME2CODE = {"Alabama":"AL","Alaska":"AK","Arizona":"AZ","Arkansas":"AR","California":"CA",
       "Colorado":"CO","Connecticut":"CT","Delaware":"DE","District of Columbia":"DC","Florida":"FL",
       "Georgia":"GA","Hawaii":"HI","Idaho":"ID","Illinois":"IL","Indiana":"IN","Iowa":"IA","Kansas":"KS",
       "Kentucky":"KY","Louisiana":"LA","Maine":"ME","Maryland":"MD","Massachusetts":"MA","Michigan":"MI",
       "Minnesota":"MN","Mississippi":"MS","Missouri":"MO","Montana":"MT","Nebraska":"NE","Nevada":"NV",
       "New Hampshire":"NH","New Jersey":"NJ","New Mexico":"NM","New York":"NY","North Carolina":"NC",
       "North Dakota":"ND","Ohio":"OH","Oklahoma":"OK","Oregon":"OR","Pennsylvania":"PA","Rhode Island":"RI",
       "South Carolina":"SC","South Dakota":"SD","Tennessee":"TN","Texas":"TX","Utah":"UT","Vermont":"VT",
       "Virginia":"VA","Washington":"WA","West Virginia":"WV","Wisconsin":"WI","Wyoming":"WY"}

     df = pd.read_csv(CSV_PATH); df.columns=[c.strip() for c in df.columns]
     df[COUNT_COL] = pd.to_numeric(df[COUNT_COL])
     counts = dict(zip(df[NAME_COL], df[COUNT_COL]))
     TOTAL  = int(df[COUNT_COL].sum())

     try: gj = json.load(open("us-states.json"))
     except FileNotFoundError:
         gj = json.load(urllib.request.urlopen(GEOJSON_URL)); json.dump(gj, open("us-states.json","w"))

     # --- Albers USA conic projection (contiguous 48) ---
     p1,p2,p0,l0 = map(math.radians,(29.5,45.5,37.5,-96.0))
     n=0.5*(math.sin(p1)+math.sin(p2)); C=math.cos(p1)**2+2*n*math.sin(p1); rho0=math.sqrt(C-2*n*math.sin(p0))/n
     def alb(lon,lat):
         lam,phi=math.radians(lon),math.radians(lat); th=n*(lam-l0)
         rho=math.sqrt(max(C-2*n*math.sin(phi),0))/n
         return (rho*math.sin(th), rho0-rho*math.cos(th))
     SKIP={"Alaska","Hawaii"}
     def rings(g): return [g["coordinates"]] if g["type"]=="Polygon" else (g["coordinates"] if g["type"]=="MultiPolygon" else [])
     pts=[]; fp={}
     for f in gj["features"]:
         nm=f["properties"]["name"]
         if nm in SKIP: continue
         polys=[]
         for poly in rings(f["geometry"]):
             rr=[]
             for ring in poly:
                 pr=[alb(x,y) for x,y in ring]; rr.append(pr); pts+=pr
             polys.append(rr)
         fp[nm]=polys
     xs=[p[0] for p in pts]; ys=[p[1] for p in pts]
     minx,maxx,miny,maxy=min(xs),max(xs),min(ys),max(ys)
     W,H,PAD=720,440,14
     s=min((W-2*PAD)/(maxx-minx),(H-2*PAD)/(maxy-miny))
     ox=(W-(maxx-minx)*s)/2; oy=(H-(maxy-miny)*s)/2
     tx=lambda x:PAD+ox+(x-minx)*s; ty=lambda y:PAD+oy+(maxy-y)*s

     # --- ONE shared PSD heat ramp (log-scaled): fewer=light green → more=near-black-green
     STOPS=[(0.0,(240,240,226)),(0.45,(204,255,0)),(0.78,(120,150,0)),(1.0,(26,30,8))]
     def ramp(t):
         t=max(0,min(1,t))
         for i in range(len(STOPS)-1):
             t0,c0=STOPS[i]; t1,c1=STOPS[i+1]
             if t<=t1:
                 f=(t-t0)/(t1-t0) if t1>t0 else 0
                 return tuple(round(c0[k]+(c1[k]-c0[k])*f) for k in range(3))
         return STOPS[-1][1]
     mx=math.log10(max(counts.values()))
     def rgb(nm):
         v=counts.get(nm,0)
         return None if v<=0 else ramp(math.log10(v)/mx)
     def color(nm):                                   # <-- used for BOTH map + bars
         c=rgb(nm); return "#ECECEC" if c is None else "#%02X%02X%02X"%c
     def lum(nm):
         c=rgb(nm);  return 1.0 if c is None else (0.2126*c[0]+0.7152*c[1]+0.0722*c[2])/255

     def dpath(polys):
         d=[]
         for rr in polys:
             for ring in rr:
                 if len(ring)<2: continue
                 d.append("M"+" L".join(f"{tx(x):.1f},{ty(y):.1f}" for x,y in ring)+"Z")
         return "".join(d)
     paths="".join(f'<path d="{dpath(p)}" fill="{color(nm)}" stroke="#FFFFFF" stroke-width="1" '
                    f'stroke-linejoin="round"><title>{nm}: {counts.get(nm,0)}</title></path>' for nm,p in fp.items())
     MAP_SVG=(f'<svg class="usmap" viewBox="0 0 {W} {H}" role="img" preserveAspectRatio="xMidYMid meet" '
              f'xmlns="http://www.w3.org/2000/svg" aria-label="US map heat-shaded by orders per state">{paths}</svg>')

     # --- top-N bar rows: fill = SAME ramp color as the state's map fill ---
     d2=df.sort_values(COUNT_COL,ascending=False).reset_index(drop=True); maxv=int(d2[COUNT_COL].max())
     rows=[]
     for i,r in d2.head(TOP_N).iterrows():
         nm=r[NAME_COL]; v=int(r[COUNT_COL]); code=NAME2CODE.get(nm,str(nm)[:2].upper())
         pct=v/TOTAL*100; w=v/maxv*100; fill=color(nm)
         edge="rgba(0,0,0,.10)" if lum(nm)>0.72 else "transparent"   # keep pale bars visible
         lead=" st-lead" if i==0 else ""                              # #1 row → red name (rank cue)
         rows.append(f'<div class="strow{lead}"><div class="stname">{code} <span>{nm}</span></div>'
                     f'<div class="stbar"><span style="width:{w:.1f}%;background:{fill};'
                     f'box-shadow:inset 0 0 0 1px {edge}"></span></div>'
                     f'<div class="stval mono"><b>{v:,}</b><small>{pct:.1f}%</small></div></div>')
     STATE_ROWS="\n".join(rows)
     rest=int(d2[COUNT_COL].iloc[TOP_N:].sum()); n_rest=len(d2)-TOP_N; rest_pct=rest/TOTAL*100

     print("=== MAP_SVG ==="); print(MAP_SVG)
     print("=== STATE_ROWS ==="); print(STATE_ROWS)
     print("=== REST ==="); print(f"+ {n_rest} more · {rest:,} · {rest_pct:.1f}%")
     ----------------------------------------------------------------------------
     ► EXAMPLE row (note the inline ramp fill — dark = the max/#1 state):
       <div class="strow st-lead"><div class="stname">MA <span>Massachusetts</span></div>
       <div class="stbar"><span style="width:100.0%;background:#1A1E08;box-shadow:inset 0 0 0 1px transparent"></span></div>
       <div class="stval mono"><b>1,138</b><small>45.7%</small></div></div>
============================================================================ -->

<style>
  /* --- scoped so it can be pasted into any report without collisions --- */
  .psd-map-module{
    --black:#0B0B0B; --ink:#161616; --muted:#777777;
    --card:#FFFFFF; --line:#E7E7E7; --line2:#DADADA;
    --neon:#CCFF00;        /* PRIMARY ACCENT — brand neon green */
    --brand-red:#E4002B;   /* PRIMARY BRAND COLOR — brand red   */
    /* purple (#9C00FF) is women's-only and intentionally NOT used here */
    --shadow:0 1px 2px rgba(11,11,11,.06),0 8px 24px rgba(11,11,11,.05);
    font-family:'Inter','Helvetica Neue',Arial,system-ui,sans-serif;  /* Aktiv Grotesk substitute */
    color:var(--ink);
  }
  .psd-map-module .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

  .psd-map-module .sechead{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--black);
    padding-bottom:6px;margin-bottom:10px}
  .psd-map-module .sechead .no{font-weight:900;font-size:13px;color:var(--brand-red)}
  .psd-map-module .sechead h2{font-size:14.5px;margin:0;text-transform:uppercase;letter-spacing:.01em;font-weight:800} /* headings all-caps */
  .psd-map-module .sechead .tag{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:600}                  /* subhead sentence case */

  .psd-map-module .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .psd-map-module .geo{padding:14px 16px}
  .psd-map-module .geo-in{display:grid;grid-template-columns:1fr 250px;gap:16px;align-items:center}
  .psd-map-module .mapwrap{display:flex;flex-direction:column;gap:6px}
  .psd-map-module .usmap{width:100%;height:auto;display:block;max-height:320px}
  .psd-map-module .maplegend{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--muted);font-weight:600}
  /* legend ramp is the SAME ramp used for map paths AND bar fills */
  .psd-map-module .rampbar{flex:1;height:8px;border-radius:5px;
    background:linear-gradient(90deg,#F0F0E2,#CCFF00,#789600,#1A1E08)}

  .psd-map-module .stlist{display:flex;flex-direction:column;gap:7px;justify-content:center}
  .psd-map-module .strow{display:grid;grid-template-columns:96px 1fr 70px;align-items:center;gap:8px}
  .psd-map-module .stname{font-size:11px;font-weight:700}
  .psd-map-module .stname span{display:none}          /* show 2-letter code */
  .psd-map-module .st-lead .stname{color:var(--brand-red);font-weight:800}   /* #1 rank cue (text only) */
  .psd-map-module .stbar{height:9px;border-radius:5px;background:#ECECEC;overflow:hidden}
  .psd-map-module .stbar span{display:block;height:100%}   /* FILL COLOR set inline = ramp(value); matches the map */
  .psd-map-module .stval{text-align:right;font-size:11px;color:var(--muted)}
  .psd-map-module .stval b{color:var(--ink);font-weight:700} .psd-map-module .stval small{margin-left:5px}
  .psd-map-module .strest{margin-top:6px;font-size:10.5px;color:var(--muted);
    border-top:1px dashed var(--line2);padding-top:7px}
</style>

<!-- ===== MODULE MARKUP — fill the {{...}} slots from the generator output ===== -->
<section class="psd-map-module">
  <div class="sechead">
    <span class="no">{{NN}}</span>
    <h2>{{SECTION_TITLE}}</h2>            <!-- e.g. "WHERE IT SHIPPED — TOP STATES" (all caps) -->
    <span class="tag">{{RIGHT_TAG}}</span> <!-- e.g. "45 states + PR" -->
  </div>

  <div class="card geo">
    <div class="geo-in">
      <div class="mapwrap">
        {{MAP_SVG}}
        <div class="maplegend"><span>Fewer</span><span class="rampbar"></span><span>More</span></div>
      </div>
      <div class="stlist">
        {{STATE_ROWS}}
        <div class="strest mono">+ {{N_REST}} more · <b>{{REST_COUNT}}</b> · {{REST_PCT}}%</div>
      </div>
    </div>
  </div>
</section>
